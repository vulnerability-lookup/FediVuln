ci:
  autoupdate_schedule: monthly
repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: ["--py37-plus"]
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-implicit-str-concat
        args: ["--max-line-length=120"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: trailing-whitespace
        exclude: .md
      - id: end-of-file-fixer
        exclude: tests/.*
  # The upstream pip-audit hook audits the hook's own virtualenv (pip-audit's
  # dependencies), not FediVuln's. Audit the locked dependencies instead.
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (poetry.lock)
        language: python
        additional_dependencies: ["pip-audit==2.10.1"]
        entry: >-
          bash -c 'set -o pipefail;
          poetry export --all-groups -f requirements.txt |
          pip-audit --require-hashes --disable-pip --progress-spinner off -r /dev/stdin'
        files: ^(pyproject\.toml|poetry\.lock)$
        pass_filenames: false
