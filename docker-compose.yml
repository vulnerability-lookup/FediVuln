name: "Fedivuln sighting client"

services:

  fedivuln-client:
    image: vuln_lookup_fedivuln-client
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_IMAGE=python:3.11-slim
    restart: always
    # Arguments for FediVuln-Stream (the image default is --public --push-sighting).
    # Add --websocket if the Mastodon server buffers HTTP streaming responses.
    # command: ["--public", "--push-sighting", "--websocket"]
    environment:
      - PYTHONUNBUFFERED=TRUE
      - FEDIVULN_CONFIG=/etc/conf.py
    volumes:
      - "./fedivuln/conf.py:/etc/conf.py"
